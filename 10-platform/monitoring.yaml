# 收敛后的监控平台最终状态（Grafana + node-exporter）
#
# 这是 01-monitoring + 02-discovery + 03-alerting + 05-logging 多次演进后的合并结果，
# 每个资源只保留最后一次修改的版本，供 ArgoCD 直接接管。
#
# 逐份演进的历史版本保留在 ../01-monitoring 等目录中，用于还原学习步骤；
# GitOps 只消费本目录，避免同一资源被多处管理。

---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

---
# Grafana 数据源：Prometheus（指标）+ Loki（日志）
# 用 provisioning 声明式注入，而不是在 UI 里手点 —— 配置即代码，重装即恢复
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        editable: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # grafana 镜像以 uid 472 运行
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
          env:
            # 密码从 Secret 注入，绝不写进 Git。
            # ⚠️ 关键坑：Grafana 首次启动后会把管理密码存进 grafana.db（在 PVC 里），
            # 之后改这个环境变量**不会生效** —— 它只在"全新的 grafana.db"上起作用。
            # 存量实例必须用 CLI 重置：
            #   kubectl exec -n monitoring deploy/grafana -- \
            #     grafana cli admin reset-admin-password '<新密码>'
            # 这与"改了 ConfigMap 进程不重载"是同一类问题：
            # **配置源变更 ≠ 运行态变更**，要看组件把状态存在哪。
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
                  # 不用 optional：凭据缺失必须让 Pod 起不来（fail loudly），
                  # 而不是悄悄退回 Grafana 的默认口令 admin/admin
                  optional: false
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 384Mi
              cpu: 300m
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        # 持久化：手建的仪表盘、用户、API Key 都存在这里，
        # 之前用 emptyDir 时 Grafana 一重启全没了（数据源靠 ConfigMap 能自愈，仪表盘不能）
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  # ClusterIP 而不是 NodePort：管理界面不该暴露在公网。
  # 访问方式改为 SSH 隧道直达 ClusterIP，见 README 第 27 条。
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000

---
# Grafana 状态目录（sqlite + 仪表盘 + 插件）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
# node-exporter 用 DaemonSet：每个节点都必须有一个，采集的是宿主机指标
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
          ports:
            - containerPort: 9100
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /

---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    app: node-exporter
  ports:
    - port: 9100
      targetPort: 9100
