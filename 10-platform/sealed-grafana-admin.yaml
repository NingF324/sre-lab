# Grafana 管理密码 —— 用 SealedSecrets 加密后提交 Git
#
# 背景：这个密码原先明文写在 monitoring.yaml 里（`value: "admin123"`），
# 而仓库是 public 的 —— 等于把管理密码对全世界公开。见 README 第 28 条。
#
# 现在分两层：
#   1. monitoring.yaml 里只留 secretKeyRef，密码不进 Git；
#   2. 密文放这里，明文只存在于已经被 SealedSecrets 解密出来的集群内 Secret 里。
#
# ⚠️ 注意：Grafana 首次启动会把密码写进 grafana.db，之后改环境变量无效。
# 本文件只保证"全新的 Grafana 实例能拿到正确密码"。
# 存量实例改密码要用：
#   kubectl -n monitoring exec deploy/grafana -- grafana cli admin reset-admin-password '<新密码>'
#
# 重新加密的方法见 README 第 30 条。

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
    type: Opaque
