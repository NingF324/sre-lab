# 收敛后的 Prometheus 最终状态（RBAC + 服务发现 + 告警规则）
#
# 合并来源：
#   ServiceAccount / ClusterRole / ClusterRoleBinding  <- 02-discovery
#   prometheus-config（含 k8s SD + alerting 段 + rule_files） <- 03-alerting（最终版）
#   prometheus-rules / prometheus Deployment（含 rules 挂载）  <- 03-alerting

---
# RBAC：Prometheus 要 list/watch Pod、节点和 kubelet 指标，
# 没有这个 ClusterRole，服务发现拿不到任何目标。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: [get]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]

      - job_name: node-exporter
        static_configs:
          - targets: [node-exporter:9100]

      # Alertmanager 自身：让"告警链路"也被监控起来
      # 关键指标 alertmanager_notifications_failed_total（webhook 投递失败数）
      # 没有这个 job，Alertmanager 挂了在 Grafana 上完全看不出来，
      # 只能靠"告警一直没来"这种被动感知——本次事故就是这么被拖住的
      - job_name: alertmanager
        static_configs:
          - targets: [alertmanager:9093]

      # Kubernetes 对象状态：Deployment 副本、Pod phase/重启、Node 状态。
      # 单独使用静态 Service 地址，避免注解发现误抓 telemetry 端口。
      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics:8080]

      # 监控平台自身：这些管理端点都只在集群内访问。
      - job_name: grafana
        static_configs:
          - targets: [grafana:3000]

      - job_name: loki
        static_configs:
          - targets: [loki:3100]

      - job_name: argocd
        static_configs:
          - targets: [argocd-metrics.argocd.svc.cluster.local:8082]

      - job_name: webhook-relay
        static_configs:
          - targets: [webhook-relay.argocd.svc.cluster.local:80]

      # kubelet 自身指标，走 https + ServiceAccount token
      - job_name: kubernetes-nodes
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # 容器级指标（等同于 kubectl top pod 的数据源）
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __metrics_path__
            replacement: /metrics/cadvisor

      # 按注解抓取业务 Pod（opt-in），避免全量噪音
      # 注意：只对有 /metrics 端点的应用加 prometheus.io/scrape 注解，
      # 否则 Prometheus 抓到 404 -> up==0 -> 触发 TargetDown 误告警
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      # ===================================================================
      # AIOps 第一阶段：动态基线
      #
      # 固定阈值的天生矛盾：定高了漏报，定低了误报。
      # 而且指标有周期性（白天高夜里低），一条水平线必然有一半时间是错的。
      #
      # 换个思路：不用固定阈值，用指标**自己的近期分布**来定义"正常"。
      # recording rule 先把中间量算好存下来，告警规则就能写得短，
      # 而且多个告警可以复用同一批中间量（顺带省查询开销）。
      #
      # ⚠️ 这个 group 必须放在 node.rules 前面：Prometheus 按文件里的
      #    顺序评估 group，告警要用到这里的 recording rule。
      # ⚠️ 首次部署 / Prometheus 重启后，需要攒够 1 小时数据
      #    （avg_over_time[1h] / stddev_over_time[1h]）才会开始出值。
      # ===================================================================
      - name: aiops.baseline
        rules:
          # ① 节点 CPU 使用率（0~1 的小数），5 分钟平滑
          - record: node:cpu_busy:ratio5m
            expr: 1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))

          # ② 近 1 小时的均值 —— 这就是"基线"
          - record: node:cpu_busy:avg1h
            expr: avg_over_time(node:cpu_busy:ratio5m[1h])

          # ③ 近 1 小时的标准差 —— 衡量波动幅度，决定"多偏离才算异常"
          - record: node:cpu_busy:stddev1h
            expr: stddev_over_time(node:cpu_busy:ratio5m[1h])

          # ④ 偏离度：当前值比基线高出多少个标准差（统计学叫 z-score）
          #
          #    clamp_min 是这里最关键的一笔：基线非常平稳时标准差趋近 0，
          #    不设下限就会出现"CPU 从 1% 涨到 2%，判定为偏离 50 个标准差"
          #    这种荒谬结论 —— 分母趋零把噪声放大成了"异常"。
          #    给标准差一个下限，等于给检测器设了一个**最小灵敏度**。
          #    这是所有基于标准差做异常检测的算法都要处理的第一个问题。
          - record: node:cpu_busy:deviation_sigma
            expr: >
              (node:cpu_busy:ratio5m - node:cpu_busy:avg1h)
              / clamp_min(node:cpu_busy:stddev1h, 0.02)

      - name: node.rules
        rules:
          - alert: NodeMemoryHigh
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: node memory usage is high
              description: "{{ $labels.instance }} memory usage is {{ printf \"%.1f\" $value }}% for 5m"

          - alert: NodeCPUHigh
            expr: avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 < 20
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: node cpu usage is high
              description: "{{ $labels.instance }} idle cpu is only {{ printf \"%.1f\" $value }}% for 5m"

          # ===== AIOps 异常检测第一版 =====
          # 与上面的 NodeCPUHigh 是互补关系，不是替代：
          #   NodeCPUHigh          回答"现在是不是很忙"（绝对值，>80%）
          #   NodeCPUDeviationHigh 回答"现在是不是反常"（相对值，偏离基线 >3σ）
          #
          # 为什么需要后者：低负载机器上固定阈值几乎永远不报警。
          # 一台平时 CPU 2% 的机器跳到 15%，业务上可能已经出问题了
          # （定时任务失控、死循环、被挖矿），但 80% 的阈值一声不吭。
          # 动态基线看的是"相对自己反常"，正好覆盖这一段盲区。
          - alert: NodeCPUDeviationHigh
            # 写法说明：把 ratio 放在 and 左边，是为了让 $value 代表 CPU 使用率
            # （描述里要用）；偏离度只作为过滤条件放右边。
            # 若反过来写，$value 会变成 σ 数，就没法直接展示百分比了。
            expr: >
              node:cpu_busy:ratio5m > 0.3
              and
              node:cpu_busy:deviation_sigma > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: node cpu is significantly above its recent baseline
              description: "{{ $labels.instance }} CPU 使用率 {{ $value | humanizePercentage }}，偏离近 1 小时基线超过 3σ"

          # 磁盘不用固定阈值，用线性回归预测 4 小时后会不会满
          - alert: NodeDiskWillFillIn4Hours
            expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[1h], 4 * 3600) < 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: node disk will fill in 4 hours
              description: "{{ $labels.instance }} mountpoint {{ $labels.mountpoint }} will be full within 4h"

      # 元监控：监控系统自己挂了，也得有人知道
      # 这条有点"悖论"——Alertmanager 挂了它自然发不出去，
      # 但它会出现在 Prometheus /alerts 和 Grafana 上，
      # 是"告警为什么没来"这件事的第一个线索
      - name: meta.rules
        rules:
          - alert: AlertmanagerDown
            expr: up{job="alertmanager"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: alertmanager is down
              description: "Alertmanager 已不可达 2 分钟，整条告警通知链路中断"

          - alert: MonitoringComponentDown
            expr: up{job=~"argocd|grafana|loki|webhook-relay|kube-state-metrics|node-exporter|kubernetes-nodes|kubernetes-cadvisor"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: monitoring component is down
              description: "监控组件 {{ $labels.job }} / {{ $labels.instance }} 已不可达 2 分钟"

      - name: pod.rules
        rules:
          # kube-state-metrics 直接读取 kubelet 记录的累计重启次数，
          # 比通过容器启动时间变化推算更准确。
          - alert: ContainerRestartingTooOften
            expr: increase(kube_pod_container_status_restarts_total{namespace!="kube-system"}[10m]) > 2
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: container is restarting too often
              description: "{{ $labels.namespace }}/{{ $labels.pod }} restarted more than 2 times in 10m"

          - alert: DeploymentReplicasUnavailable
            expr: (kube_deployment_spec_replicas{namespace!="kube-system"} - kube_deployment_status_replicas_available{namespace!="kube-system"}) > 0
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: deployment has unavailable replicas
              description: "{{ $labels.namespace }}/{{ $labels.deployment }} 缺少 {{ printf \"%.0f\" $value }} 个可用副本，已持续 3 分钟"

          - alert: PodPendingTooLong
            expr: kube_pod_status_phase{namespace!="kube-system",phase="Pending"} == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: pod has been pending too long
              description: "{{ $labels.namespace }}/{{ $labels.pod }} 已处于 Pending 状态 5 分钟"

          - alert: TargetDown
            # 平台组件由 meta.rules 负责；这里仅覆盖注解发现的业务目标，避免重复告警。
            expr: up{job="kubernetes-pods"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: scrape target is down
              description: "{{ $labels.job }} / {{ $labels.instance }} is down for 2m"

          # 恒真告警，专门用来验证告警链路是否通畅
          - alert: Watchdog
            expr: vector(1)
            for: 0m
            labels:
              severity: none
            annotations:
              summary: alerting pipeline heartbeat
              description: "This alert always fires. It proves the alerting pipeline works."

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  # RWO 卷 + 单副本：必须先停后起，否则新 Pod 卡在等旧 Pod 释放卷
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        # ConfigMap 内容变化本身不会触发 Deployment 滚动更新。
        config-revision: "2026-09-11-meta-monitoring"
    spec:
      serviceAccountName: prometheus
      # prometheus 官方镜像以 uid 65534（nobody）运行，
      # 卷必须让这个 uid 可写，否则起不来
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            # 允许 POST /-/reload 热加载配置，改 ConfigMap 后不必重启 Pod
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          # TSDB/WAL 恢复期间进程已启动，但查询接口仍会返回 503。
          # startupProbe 防止恢复较慢时被误杀；readinessProbe 确保 Service
          # 只把流量发给真正可查询的实例。
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: 500m
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        # TSDB 持久化：否则 Pod 一重启，历史指标和压测曲线全没了
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  # ClusterIP：Prometheus 的 UI/API 不对外暴露，走 SSH 隧道访问
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090

---
# TSDB 存储。retention 7d + cAdvisor 指标量不小，给 8Gi。
# 注意：k3s 的 local-path 默认 allowVolumeExpansion=false，
# 卷大小不能在线扩，所以初次申请要留足余量，真满了只能重建 PVC 再导数据。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
