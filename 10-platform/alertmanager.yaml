# Alertmanager：告警的路由、分组、抑制
#
# 虽然没有 kube-prometheus-stack 那么全，但这套配置覆盖了生产最核心的三件事：
#   1. 按 severity 分流（严重的叫得又快又勤）
#   2. inhibit_rules 抑制（大问题出现时，同名小告警不再刷屏）
#   3. receiver 可插拔（学习期空着，生产接钉钉/企微/PagerDuty）

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      routes:
        # critical 走更短的等待、更频繁的重发
        - matchers:
            - severity="critical"
          receiver: default
          group_wait: 10s
          repeat_interval: 1h

    receivers:
      - name: default
        # 告警富化服务：每条告警推给它，自动查指标+日志生成诊断卡片
        webhook_configs:
          - url: http://alert-enricher.monitoring.svc.cluster.local:8080/webhook
            send_resolved: true
      # 想再接钉钉，加第二个 webhook_config 指向钉钉机器人即可

    # critical 抑制同名 warning，避免同一个问题刷两条
    inhibit_rules:
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity="warning"']
        equal: ['alertname']

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      # alertmanager 镜像以 uid 65534（nobody）运行
      securityContext:
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            # 坑：这里千万别加 --web.enable-lifecycle！
            # 那是 Prometheus 的专属参数，Alertmanager 不认识，加了会直接启动失败：
            #   alertmanager: error: unknown long flag '--web.enable-lifecycle'
            # 症状很有迷惑性：Pod 起不来 -> kubectl exec 报 container not found，
            # 而 Prometheus 的 /api/v1/alertmanagers 仍然把 9093 列为 active，
            # 看起来"配置是对的"，其实一条告警都发不出去。
            # Alertmanager 本来就监听配置文件变化自动重载，不需要任何开关。
          ports:
            - containerPort: 9093
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        # 存的是 Silence 和通知状态。用 emptyDir 的话，
        # 每次重启你手工设的 Silence 全丢，告警又开始狂轰滥炸
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  # ClusterIP：Silence 管理界面不对外暴露，走 SSH 隧道访问
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093

---
# Silence / 通知状态存储，量很小，1Gi 足够
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
