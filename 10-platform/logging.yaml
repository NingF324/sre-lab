# 收敛后的日志栈最终状态（Loki + Promtail）
#
# promtail-config 采用 05-logging/promtail-fix.yaml 的静态路径版本 ——
# kubernetes_sd_configs 在本环境（k3s）返回 0 个目标且静默失败，不能用。

---
# Loki 只给标签建索引，正文压缩后原样存储。
# 代价是全文检索慢，收益是资源占用比 ES 低一个数量级 —— 4G 机器只能这么选。
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /var/loki
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v12
          index:
            prefix: index_
            period: 24h

    storage_config:
      boltdb_shipper:
        active_index_directory: /var/loki/index
        cache_location: /var/loki/cache
        cache_ttl: 24h
      filesystem:
        directory: /var/loki/chunks

    limits_config:
      retention_period: 72h
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h

    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true

    ruler:
      storage:
        type: local
        local:
          directory: /etc/loki-rules
      # 规则源由 ConfigMap 只读挂载，工作目录必须单独可写。
      rule_path: /var/loki/ruler-tmp
      alertmanager_url: http://alertmanager.monitoring.svc.cluster.local:9093
      enable_alertmanager_v2: true
      evaluation_interval: 30s
      poll_interval: 30s
      ring:
        kvstore:
          store: inmemory

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
spec:
  replicas: 1
  # 同 Prometheus：RWO 卷 + 单副本用 Recreate
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      # loki 镜像以 uid 10001 运行，emptyDir 默认属主是 root，
      # 不加 fsGroup 会写不进数据目录直接起不来
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:2.9.8
          args:
            - -config.file=/etc/loki/loki-config.yaml
          ports:
            - containerPort: 3100
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /var/loki
            - name: rules
              mountPath: /etc/loki-rules
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: loki-config
        # chunk + 索引持久化，否则重启后查不到任何历史日志
        # （fsGroup: 10001 已配好，PVC 同样生效）
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
        - name: rules
          configMap:
            name: loki-rules
            items:
              - key: demo-alerts.yaml
                # auth_enabled: false 使用固定租户 fake。
                path: fake/demo-alerts.yaml

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: monitoring
data:
  demo-alerts.yaml: |
    groups:
      - name: demo-log-alerts
        interval: 30s
        rules:
          - alert: DemoErrorLogsHigh
            expr: sum by (namespace) (rate({namespace="demo"} |= "ERROR" [5m])) > 0.1
            for: 1m
            labels:
              severity: warning
              source: loki
            annotations:
              summary: "demo 命名空间 ERROR 日志过多"
              description: "最近 5 分钟 ERROR 日志平均速率为 {{ $value }} 条/秒，超过 0.1 条/秒并持续 1 分钟。"

---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100

---
# 日志 chunk + boltdb 索引。retention 72h，给 5Gi。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring

---
# 静态路径采集：不走 K8s 服务发现，直接通配符扫描，
# 再用正则从文件路径反解出 namespace / pod / container 标签。
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      # 位置文件记录"每个日志文件读到哪一行了"，必须持久化：
      # 放 /tmp 的话 Promtail 一重启就失忆，
      # 结果要么漏采（从文件末尾重新开始）、要么重复采（从头再来一遍）。
      # 用宿主机目录存 —— DaemonSet 每个节点一份，天然适合 hostPath。
      filename: /var/lib/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: container-logs
        static_configs:
          - targets:
              - localhost
            labels:
              job: container-logs
              __path__: /var/log/pods/*/*/*.log
        pipeline_stages:
          - cri: {}
          - regex:
              source: filename
              expression: ^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_(?P<uid>[^/]+)/(?P<container>[^/]+)/.*\.log$
          - labels:
              namespace:
              pod:
              container:

---
# DaemonSet：每个节点一份，Deployment 做不到这点
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      # 需要 root 才能读 /var/log/pods 下的日志（属主 root，权限 0640）
      securityContext:
        runAsUser: 0
      containers:
        - name: promtail
          image: grafana/promtail:2.9.8
          args:
            - -config.file=/etc/promtail/promtail.yaml
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: containers-logs
              mountPath: /var/log/containers
              readOnly: true
            - name: positions
              mountPath: /var/lib/promtail
      volumes:
        - name: positions
          hostPath:
            path: /var/lib/promtail
            # 目录不存在时自动创建，避免首次部署 Pod 起不来
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: promtail-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: containers-logs
          hostPath:
            path: /var/log/containers
