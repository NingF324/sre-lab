# 为 ArgoCD 的 webhook 单独开一个 NodePort 入口
#
# 为什么新建 Service 而不是改 argocd-server 那个：
#   1. 加式变更 —— 不动原有对象，出问题 kubectl delete 就回滚，不会把 ArgoCD 弄挂
#   2. 最小暴露面 —— 只转发 8080，UI/API 的其它路径仍只能集群内访问
#   3. 可声明式管理 —— 这个 Service 由 Git 里的 argocd Application 管着，
#      符合"一切变更走 Git"的纪律
#
# 为什么需要它：
#   ArgoCD 默认 3 分钟轮询 Git。配了 webhook 后 push 即触发刷新，秒级生效。
#   /api/webhook 端点必须由 Git 服务商（GitHub）从公网访问到，
#   所以得有个 NodePort 把请求引进来。

---
apiVersion: v1
kind: Service
metadata:
  name: argocd-webhook
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-webhook
    app.kubernetes.io/part-of: argocd
spec:
  type: NodePort
  # selector 指向 argocd-server 的 Pod（跟原 Service 一模一样），
  # 两个 Service 可以指向同一批 Pod，互不影响
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
      # 固定端口，便于防火墙只放行这一个
      nodePort: 30080
      protocol: TCP
