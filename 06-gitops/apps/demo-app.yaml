# 业务服务 Application：把 04-demo-app 目录交给 ArgoCD
#
# 关键设计 —— ignoreDifferences：
#   Deployment 的 spec.replicas 由 HPA 控制，不忽略的话 ArgoCD 会认定集群
#   "偏离 Git" 并反复改回去，与 HPA 打架导致副本数抖动。
#   这是 GitOps 与自动扩缩容共存的标准解法。

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default

  source:
    # 拉取源用 Gitee：repo-server 访问 github.com 实测间歇性超时（见 README 第 24 条）。
    # 2026-09-10 曾切到 GitHub 想用原生 webhook，2026-09-11 因 TLS handshake timeout 回退。
    # 教训：连通性测试必须测"真实会走的那条路径"（git-upload-pack），不是随便挑一个域名。
    repoURL: https://gitee.com/ningf321/sre-lab.git
    targetRevision: master
    path: 04-demo-app

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: php-apache
      jsonPointers:
        - /spec/replicas
